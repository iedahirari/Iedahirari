name: Metricas do perfil

on:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: write

concurrency:
  group: metricas-do-perfil
  cancel-in-progress: false

jobs:
  languages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
    steps:
      - name: Aguardar configuracao do token
        if: env.METRICS_TOKEN == ''
        run: echo "Adicione o segredo METRICS_TOKEN nas configuracoes do repositorio e execute este workflow novamente." >> "$GITHUB_STEP_SUMMARY"

      - name: Gerar painel de linguagens
        if: env.METRICS_TOKEN != ''
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          user: iedahirari
          filename: github-metrics.svg
          template: classic
          base: ""
          config_timezone: America/Sao_Paulo
          plugin_languages: "yes"
          plugin_languages_indepth: "yes"
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_languages_colors: github
          plugin_languages_details: percentage
          plugins_errors_fatal: "yes"

      - name: Gerar estatisticas do perfil
        if: env.METRICS_TOKEN != ''
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          user: iedahirari
          filename: github-metrics-stats.svg
          template: classic
          base: activity, community, repositories
          config_timezone: America/Sao_Paulo
          plugins_errors_fatal: "yes"
